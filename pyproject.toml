[project]
name = "annual-report-rag"
version = "0.1.0"
description = "RAG-Agent zur Analyse von Geschäftsberichten – lokal mit Ollama oder in Azure (OpenAI, AI Search, Container Apps)"
readme = "README.md"
authors = [
    { name = "Moritz Dittrich", email = "molla.ditt@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "azure-identity>=1.25.3",
    "azure-search-documents>=12.0.0",
    "azure-storage-blob>=12.30.3",
    "fastapi>=0.142.2",
    "numpy>=2.4.6",
    "openai>=3.22.1",
    "pydantic-settings>=2.15.0",
    "pymupdf>=1.28.2",
    "rank-bm25>=0.2.2",
    "rich>=15.0.0",
    "typer>=0.27.2",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
arr = "annual_report_rag.cli:app"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501", "B008"]  # Zeilenlänge regelt der Formatter; B008 ist bei Typer idiomatisch

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
